<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groundwork — AI use-case discovery for Meridian Reserve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1200 900" preserveAspectRatio="none">
    <g fill="none" stroke="#9A6A34" stroke-width="1">
      <path opacity=".22" d="M-50,120 C150,60 350,160 550,110 S950,40 1250,130"/>
      <path opacity=".18" d="M-50,220 C180,150 380,260 600,210 S980,150 1250,240"/>
      <path opacity=".15" d="M-50,340 C200,270 420,380 640,330 S1000,270 1250,360"/>
      <path opacity=".13" d="M-50,520 C220,460 440,560 660,500 S1020,440 1250,540"/>
      <path opacity=".16" d="M-50,650 C200,600 420,700 640,650 S1000,590 1250,680"/>
      <path opacity=".20" d="M-50,780 C200,730 420,830 640,780 S1000,720 1250,810"/>
    </g>
  </svg>
</div>

<div id="app" class="app full" role="application" aria-label="Groundwork, an AI use-case discovery game">
  <button class="linkbtn" id="aiSettingsHero" style="position:absolute;top:20px;right:20px;opacity:0.7" data-act="ai-settings">⚙ AI</button>
</div>

<div id="modal" class="modal" hidden>
  <div class="card" id="modalCard"></div>
</div>

<div id="aiSettings" class="modal" hidden>
  <div class="card" style="max-width:400px">
    <h3>AI Settings</h3>
    <p class="tiny muted">Connect to Ollama or another OpenAI-compatible local LLM to enable personalized nudges.</p>
    <div class="field">
      <label for="aiBase">API Base URL</label>
      <input class="in" id="aiBase" placeholder="http://localhost:11434/v1" value="http://localhost:11434/v1">
    </div>
    <div class="field">
      <label for="aiModel">Model</label>
      <input class="in" id="aiModel" placeholder="llama2" value="">
    </div>
    <p class="tiny muted" id="aiStatus" style="margin:8px 0">Checking connection...</p>
    <div class="actions">
      <button class="btn sec" data-act="ai-cancel">Close</button>
      <button class="btn" data-act="ai-connect">Test & Connect</button>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
