<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173B36">
<title>Groundwork: AI use-case discovery for Meridian Reserve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bgmap" aria-hidden="true">
  <svg viewBox="0 0 1200 900" preserveAspectRatio="none">
    <g fill="none" stroke="currentColor" stroke-width="1">
      <path d="M-50,120 C150,60 350,160 550,110 S950,40 1250,130"/>
      <path d="M-50,220 C180,150 380,260 600,210 S980,150 1250,240"/>
      <path d="M-50,340 C200,270 420,380 640,330 S1000,270 1250,360"/>
      <path d="M-50,520 C220,460 440,560 660,500 S1020,440 1250,540"/>
      <path d="M-50,650 C200,600 420,700 640,650 S1000,590 1250,680"/>
      <path d="M-50,780 C200,730 420,830 640,780 S1000,720 1250,810"/>
    </g>
  </svg>
</div>

<div id="app" aria-label="Groundwork, an AI use-case discovery game"></div>

<div id="guide" class="guide" hidden></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="fx" class="fx" aria-hidden="true"></div>

<button class="aipill" id="aiSettingsBtn" aria-label="AI guide connection settings">
  <span class="dot" id="aiPillDot" aria-hidden="true"></span>AI guide
</button>

<div id="modal" class="modal" hidden>
  <div class="dispatch" id="modalCard" role="dialog" aria-modal="true"></div>
</div>

<div id="aiSettings" class="modal" hidden>
  <div class="dispatch settings" role="dialog" aria-modal="true" aria-labelledby="aiTitle">
    <h3 id="aiTitle">AI guide connection</h3>
    <p class="small">Personal hints and tool reasoning come from Together.ai. The game works fully without a connection; the field guide uses its built-in hints.</p>
    <div class="formfield">
      <label for="aiModel">Model</label>
      <input class="in" id="aiModel" placeholder="mistralai/Mistral-7B-Instruct-v0.1" value="">
      <span class="hint">Any Together.ai chat or instruct model id.</span>
    </div>
    <div class="formfield">
      <label for="aiKey">API key</label>
      <input class="in" id="aiKey" type="password" placeholder="Together.ai API key" value="">
      <span class="hint">Stored only in this browser. Leave empty to keep the current key.</span>
    </div>
    <p class="small" id="aiStatus">Checking the connection&hellip;</p>
    <div class="actions">
      <button class="btn ghost" data-act="ai-cancel">Close</button>
      <button class="btn primary" data-act="ai-connect">Test and connect</button>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script src="data.js"></script>
<script src="expeditions.js"></script>
<script src="story.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
